[build-system]
requires = ["setuptools>=77.0"]
build-backend = "setuptools.build_meta"

[project]
name = "aksha"
version = "0.2.0"
description = "Scalable HMM-based sequence search and retrieval"
readme = "readme.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Jacob West-Roberts" }]
requires-python = ">=3.12,<3.13"
keywords = ["hmm", "hmmer", "pyhmmer", "bioinformatics", "sequence-search", "genomics", "metagenomics"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
]
dependencies = [
    "aksha-runtime==0.1.0",
    "pandas>=2.0.0",
    "tqdm>=4.65.0",
    "requests>=2.28.0",
    "platformdirs>=3.0.0",
]

[project.optional-dependencies]
gpu = ["aksha-cuda12==0.1.0"]

[project.urls]
Repository = "https://github.com/jwestrob/aksha"
Issues = "https://github.com/jwestrob/aksha/issues"

[project.scripts]
aksha = "aksha._launcher:main"

[tool.setuptools.packages.find]
include = ["aksha*"]

[tool.setuptools.package-data]
aksha = ["hmm_databases.json"]
