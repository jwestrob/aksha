[build-system]
requires = ["setuptools>=77.0"]
build-backend = "setuptools.build_meta"

[project]
name = "astra-hmm"
version = "0.1.0"
description = "Scalable HMM-based sequence search and retrieval"
readme = "readme.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Jacob West-Roberts" }]
requires-python = ">=3.9"
keywords = ["hmm", "hmmer", "pyhmmer", "bioinformatics", "sequence-search", "genomics", "metagenomics"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
]
dependencies = [
    # 0.10 is the floor for the HMM.cutoffs API used to inject bitscore
    # thresholds; name/accession became str rather than bytes in later
    # releases and both spellings are handled.
    "pyhmmer>=0.10.0",
    "pandas>=2.0.0",
    "tqdm>=4.65.0",
    "requests>=2.28.0",
    "platformdirs>=3.0.0",
]

[project.urls]
Repository = "https://github.com/jwestrob/aksha"
Issues = "https://github.com/jwestrob/aksha/issues"

[project.scripts]
astra = "astra.main:main"

[tool.setuptools.packages.find]
include = ["astra*"]

[tool.setuptools.package-data]
astra = ["hmm_databases.json"]
